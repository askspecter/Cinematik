<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinematik</title>
    <meta name="description" content="Cinematik — a scroll-driven cinematic story." />
    <meta property="og:title" content="Cinematik" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jura:wght@400;600&family=Noto+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23dbff77%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Loading screen -->
    <div class="loading" id="loading">
      <div class="loading-logo">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="logo-ring" />
          <circle cx="60" cy="60" r="18" class="logo-core" />
        </svg>
        <span>CINEMATIK</span>
      </div>
      <div class="loading-bar"><div class="loading-bar-fill" id="loadingFill"></div></div>
    </div>

    <!-- Fixed stage -->
    <canvas id="canvas"></canvas>

    <div class="intro" id="intro">
      <p class="intro-text" data-step="1" data-i18n="intro1"></p>
      <p class="intro-text" data-step="2" data-i18n="intro2"></p>
      <p class="intro-text" data-step="3" data-i18n="intro3"></p>
    </div>

    <div class="scroll" id="scrollHint">
      <button class="scroll-btn" type="button" aria-label="Scroll down">SCROLL</button>
      <svg class="scroll-circle" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="spin-grad">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0" />
            <stop offset="100%" stop-color="currentColor" stop-opacity="1" />
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="98" fill="none" stroke="url(#spin-grad)" stroke-width="2" />
      </svg>
    </div>

    <div class="subtitles" id="subtitles" aria-live="polite"></div>

    <div class="lang-toggle" role="group" aria-label="Subtitle language">
      <button type="button" data-language="en" aria-pressed="true">EN</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-language="zh" aria-pressed="false">中文</button>
    </div>

    <!-- Scroll track: each section is one "chapter" of the scene -->
    <main class="track">
      <section class="section" data-section="1"></section>
      <section class="section" data-section="2"></section>
      <section class="section" data-section="3"></section>
      <section class="section" data-section="4"></section>

      <section class="section section5" data-section="5">
        <div class="manifesto" id="manifesto"></div>
      </section>

      <section class="section section6" data-section="6">
        <div class="cta">
          <h2 class="cta-head">
            <span data-i18n="ctaHead"></span>
            <span class="cta-word" id="ctaWord"></span>
          </h2>
          <a class="cta-link" href="https://x.com/" target="_blank" rel="noopener noreferrer">
            <span data-i18n="ctaLink"></span>
            <svg class="arrow" width="61" height="6" viewBox="0 0 61 6" fill="none" aria-hidden="true">
              <path d="M1 5H60L48.6 1" stroke="currentColor" stroke-linecap="round" />
            </svg>
          </a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="timeline" id="timeline">
        <button type="button" data-section="1" aria-label="Chapter 1"></button>
        <button type="button" data-section="2" aria-label="Chapter 2"></button>
        <button type="button" data-section="3" aria-label="Chapter 3"></button>
        <button type="button" data-section="4" aria-label="Chapter 4"></button>
        <button type="button" data-section="5" aria-label="Chapter 5"></button>
        <button type="button" data-section="6" aria-label="Chapter 6"></button>
      </div>
      <a class="footer-x" href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="Cinematik on X">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z" />
        </svg>
      </a>
      <div class="copyright">© <span id="year"></span> CINEMATIK. ALL RIGHTS RESERVED.</div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
